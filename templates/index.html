<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBH Wallet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --primary-blue: #0284c7;
            --accent-glow: #38bdf8;
            --text-color: #ffffff;
            --subtext-color: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .balance-title {
            font-size: 13px;
            color: var(--subtext-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance {
            font-size: 36px;
            font-weight: 700;
            margin: 8px 0;
            color: var(--accent-glow);
        }

        .user-tag {
            font-size: 14px;
            color: var(--subtext-color);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .btn {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            width: 100%;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #1e293b;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            outline: 1px solid var(--accent-glow);
        }

        .address {
            word-break: break-all;
            font-size: 12px;
            color: var(--subtext-color);
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #334155;
            margin-top: 8px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="header-brand">GBH WALLET</div>

    <!-- Main Balance Card -->
    <div class="card" style="text-align: center;">
        <div class="balance-title">ያለዎት ቀሪ ሂሳብ</div>
        <div class="balance" id="balance">0.00 TON</div>
        <div class="user-tag" id="username">@user</div>
    </div>

    <!-- Deposit Address Card -->
    <div class="card">
        <div class="section-title">ገንዘብ ለመቀበል (Deposit Address)</div>
        <div class="address" id="address">አድራሻ በመጫን ላይ...</div>
    </div>

    <!-- Transfer Card -->
    <div class="card">
        <div class="section-title">ገንዘብ ለመላክ (Send TON)</div>
        <input type="text" id="recipient" placeholder="የተቀባይ Username (ለምሳሌ: @username)">
        <input type="number" id="amount" placeholder="የገንዘብ መጠን (TON)">
        <button class="btn" onclick="sendMoney()">በGBH Wallet ላክ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user || { id: 5351353727, username: "DemoUser" };

        async function fetchUserInfo() {
            try {
                const res = await fetch('/api/user_info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: user.id, username: user.username })
                });
                const data = await res.json();
                document.getElementById('balance').innerText = `${data.balance.toFixed(2)} TON`;
                document.getElementById('username').innerText = `@${data.username}`;
                document.getElementById('address').innerText = data.address;
            } catch (err) {
                console.error("Error fetching wallet data:", err);
            }
        }

        async function sendMoney() {
            const recipient = document.getElementById('recipient').value;
            const amount = document.getElementById('amount').value;

            if(!recipient || !amount) {
                alert("እባክዎን ሁሉንም መስኮች ይሙሉ!");
                return;
            }

            const res = await fetch('/api/transfer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sender_id: user.id,
                    recipient_username: recipient,
                    amount: amount
                })
            });

            const result = await res.json();
            alert(result.message);
            if(result.success) {
                fetchUserInfo();
                document.getElementById('recipient').value = '';
                document.getElementById('amount').value = '';
            }
        }

        fetchUserInfo();
    </script>
</body>
</html>
