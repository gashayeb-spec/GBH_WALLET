<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ተራመድ ብድር እና ቁጠባ | Teramed Sacco</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-color: #1b5e20;
            --accent-color: #4caf50;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h2 {
            color: var(--primary-color);
            margin: 0 0 5px 0;
        }

        .header p {
            font-size: 0.9em;
            color: #666;
            margin: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"], input[type="number"], input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: var(--accent-color);
        }

        .status-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>ተራመድ ብድርና ቁጠባ</h2>
        <p>Teramed Saving & Credit Cooperative</p>
    </div>

    <form id="saccoForm">
        <div class="form-group">
            <label for="fullName">ሙሉ ስም</label>
            <input type="text" id="fullName" required placeholder="ምሳሌ፦ አበበ በቀለ">
        </div>

        <div class="form-group">
            <label for="phone">ስልክ ቁጥር</label>
            <input type="tel" id="phone" required placeholder="09........">
        </div>

        <div class="form-group">
            <label for="savingAmount">ወርሃዊ የቁጠባ መጠን (ብር)</label>
            <input type="number" id="savingAmount" required placeholder="500">
        </div>

        <button type="submit">አባልነቴን አስመዝግብ</button>
    </form>

    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    if (tg) tg.expand();

    document.getElementById('saccoForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const fullName = document.getElementById('fullName').value;
        const phone = document.getElementById('phone').value;
        const savingAmount = document.getElementById('savingAmount').value;
        const telegramId = tg.initDataUnsafe?.user?.id || 'Unknown';

        const statusMsg = document.getElementById('statusMsg');
        statusMsg.style.color = '#333';
        statusMsg.innerText = 'በመላክ ላይ...';

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    full_name: fullName,
                    phone: phone,
                    saving_amount: savingAmount,
                    telegram_id: telegramId
                })
            });

            const result = await response.json();
            if (response.ok) {
                statusMsg.style.color = 'green';
                statusMsg.innerText = result.message;
                document.getElementById('saccoForm').reset();
            } else {
                statusMsg.style.color = 'red';
                statusMsg.innerText = result.message || 'ስህተት ተፈጥሯል፤ እባክዎ ደግመው ይሞክሩ።';
            }
        } catch (error) {
            statusMsg.style.color = 'red';
            statusMsg.innerText = 'ከሰርቨር ጋር ማገናኘት አልተቻለም።';
        }
    });
</script>

</body>
</html>
