<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBH Wallet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            background-color: #080c14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .balance {
            font-size: 32px;
            font-weight: bold;
            color: #38bdf8;
            margin: 10px 0;
        }
        .btn {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .deposit-box {
            display: none;
            text-align: left;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            word-break: break-all;
        }
        .label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
        }
        .value {
            font-size: 14px;
            font-weight: bold;
            color: #f8fafc;
            background: #1e293b;
            padding: 8px;
            border-radius: 6px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3 id="user-name">ሰላም ...</h3>
        <div class="label">የእርስዎ ባላንስ</div>
        <div class="balance"><span id="balance">0.00</span> TON</div>
    </div>

    <button class="btn" onclick="toggleDeposit()">📥 ገንዘብ ማስገቢያ (Deposit TON)</button>

    <div id="deposit-section" class="deposit-box">
        <h4 style="text-align:center; color:#38bdf8; margin-top:0;">የገንዘብ ማስገቢያ መመሪያ</h4>
        
        <div class="label">1. የዋሌት አድራሻ (Deposit Address):</div>
        <div class="value" id="master-address">Loading...</div>

        <div class="label">2. የትራንዛክሽን MEMO ID (የግዴታ ነው):</div>
        <div class="value" id="memo-id" style="color: #f59e0b;">Loading...</div>

        <div id="qrcode"></div>

        <p style="font-size: 11px; color: #ef4444; text-anchor: center;">
            ⚠️ **ማስጠንቀቂያ:** TON በሚልኩበት ጊዜ **MEMO ID** በትክክል ካላስገቡ ገንዘቡ ወደ ሂሳብዎ አይገባም!
        </p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user || { id: 123456, first_name: "Gashaye", username: "gashaye" };

        document.getElementById('user-name').innerText = `ሰላም ${user.first_name} 👋`;

        fetch('/api/user_info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                telegram_id: user.id,
                username: user.username,
                first_name: user.first_name
            })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('balance').innerText = data.balance.toFixed(2);
            document.getElementById('master-address').innerText = data.master_address;
            document.getElementById('memo-id').innerText = data.memo_id;

            // Generate QR Code
            new QRCode(document.getElementById("qrcode"), {
                text: data.master_address,
                width: 128,
                height: 128
            });
        });

        function toggleDeposit() {
            const box = document.getElementById('deposit-section');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>
