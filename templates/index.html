<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ተራመድ ሳኮ - አድሚን ቁጥጥር ፓናል</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --gold: #f59e0b;
            --text: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.1);
            --success: #10b981; --danger: #ef4444; --primary: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 1100px; margin: 0 auto; }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; }
        .header h2 { color: var(--gold); font-size: 1.2rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; }
        .card h3 { color: var(--gold); font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--gold); background: rgba(15, 23, 42, 0.5); }

        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-pending { background: rgba(245, 158, 11, 0.2); color: var(--gold); }
        .badge-approved { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .btn-action { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; margin-right: 4px; }
        .btn-approve { background: var(--success); color: #fff; }
        .btn-reject { background: var(--danger); color: #fff; }
        .btn-edit { background: var(--primary); color: #fff; }
        .btn-msg { background: var(--gold); color: #0f172a; }

        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 8px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: #fff; outline: none; font-size: 0.85rem; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: var(--card); border: 1px solid var(--gold); border-radius: 12px; width: 90%; max-width: 450px; padding: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i class="fas fa-user-shield"></i> ተራመድ ሳኮ - አድሚን መቆጣጠሪያ ፓናል</h2>
        <button class="btn-action btn-msg" onclick="loadAdminMembers()"><i class="fas fa-sync"></i> ዳታ አድስ</button>
    </div>

    <!-- 1. አባላትን ማስተዳደሪያና የብድር ደብተር መቆጣጠሪያ table -->
    <div class="card" style="margin-bottom: 20px;">
        <h3><i class="fas fa-users-cog"></i> የተመዘገቡ አባላት፣ የብድር ደብተርና ውሳኔ መስጫ</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>መለያ (Ref)</th>
                        <th>ስም</th>
                        <th>ስልክ</th>
                        <th>የተፈቀደ ብድር</th>
                        <th>የተከፈለ ብድር</th>
                        <th>ቀሪ ዕዳ</th>
                        <th>ሁኔታ</th>
                        <th>እርምጃዎች</th>
                    </tr>
                </thead>
                <tbody id="memberAdminTable">
                    <!-- በ JavaScript ይሞላል -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="grid">
        <!-- 2. ለተበዳሪው የብድር መጠን መመዝገቢያና ማዘመኛ -->
        <div class="card">
            <h3><i class="fas fa-hand-holding-usd"></i> የብድርና ዕዳ መዝገብ ማዘመኛ</h3>
            <form id="updateLoanForm">
                <div class="input-group">
                    <label>አባል ይምረጡ</label>
                    <select id="loanMemberSelect" required></select>
                </div>
                <div class="input-group">
                    <label>የተፈቀደ አዲስ የብድር መጠን (ETB)</label>
                    <input type="number" id="approvedLoanInput" placeholder="ምሳሌ፦ 50000" required>
                </div>
                <div class="input-group">
                    <label>እስካሁን የተከፈለ ብድር (ETB)</label>
                    <input type="number" id="paidLoanInput" placeholder="ምሳሌ፦ 10000" value="0" required>
                </div>
                <button type="submit" class="btn-action btn-approve" style="width: 100%; padding: 10px;"><i class="fas fa-save"></i> የብድር መረጃውን አፕዴት አድርግ</button>
            </form>
        </div>

        <!-- 3. ለአባሉ ቀጥታ መልእክት / ማሳወቂያ መላኪያ -->
        <div class="card">
            <h3><i class="fas fa-paper-plane"></i> ለአባሉ ቀጥታ መልእክት / SMS መላኪያ</h3>
            <form id="sendMessageForm">
                <div class="input-group">
                    <label>የሚላክለት አባል</label>
                    <select id="msgMemberSelect" required></select>
                </div>
                <div class="input-group">
                    <label>የመልእክቱ ርዕስ</label>
                    <input type="text" id="msgTitle" placeholder="ምሳሌ፦ የብድር ክፍያ ማሳሰቢያ" required>
                </div>
                <div class="input-group">
                    <label>መልእክት</label>
                    <textarea id="msgBody" rows="3" placeholder="መልእክትዎን እዚህ ይፃፉ..." required></textarea>
                </div>
                <button type="submit" class="btn-action btn-msg" style="width: 100%; padding: 10px;"><i class="fas fa-paper-plane"></i> መልእክቱን ላክ</button>
            </form>
        </div>
    </div>

    <!-- 4. የተበላሹ ብድሮች (Non-Performing / Default Loans) መከታተያ -->
    <div class="card">
        <h3 style="color: var(--danger);"><i class="fas fa-exclamation-triangle"></i> የተበላሹ ብድሮች እና የዘገዩ ክፍያዎች መከታተያ</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>መለያ (Ref)</th>
                        <th>ስም</th>
                        <th>ያልተከፈለ ቀሪ ዕዳ</th>
                        <th>ሁኔታ</th>
                        <th>እርምጃ</th>
                    </tr>
                </thead>
                <tbody id="defaultLoansTable">
                    <!-- በ JavaScript ይሞላል -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL: አባልን ሰርዝ ማረጋገጫ -->
<div id="deleteModal" class="modal hidden">
    <div class="modal-content">
        <h3 style="color: var(--danger); margin-bottom: 10px;"><i class="fas fa-exclamation-triangle"></i> አባል ማሰረዣ</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">ይህንን አባል ከአባልነት መሰረዝ ይፈልጋሉ? ይህ ድርጊት አይመለስም።</p>
        <input type="hidden" id="deleteTargetId">
        <div style="display: flex; gap: 10px;">
            <button class="btn-action btn-reject" style="flex: 1; padding: 8px;" onclick="confirmDeleteMember()">አዎ ሰርዝ</button>
            <button class="btn-action btn-edit" style="flex: 1; padding: 8px;" onclick="closeDeleteModal()">ተመለስ</button>
        </div>
    </div>
</div>

<script>
    let membersData = [];

    window.addEventListener('DOMContentLoaded', () => {
        loadAdminMembers();
    });

    // 1. አባላትን ከ Backend መጫን
    async function loadAdminMembers() {
        try {
            const res = await fetch('/api/admin/members');
            const data = await res.json();
            membersData = data.members || [];
            
            renderTables();
            populateSelects();
        } catch(e) {
            console.error("አባላትን መጫን አልተቻለም", e);
        }
    }

    // 2. ሰንጠረዦችን መሙላት
    function renderTables() {
        const tbody = document.getElementById('memberAdminTable');
        const defaultTbody = document.getElementById('defaultLoansTable');
        tbody.innerHTML = '';
        defaultTbody.innerHTML = '';

        if(membersData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">ምንም የተመዘገበ አባል አልተገኘም።</td></tr>`;
            defaultTbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">ምንም የተበላሸ ብድር የለም።</td></tr>`;
            return;
        }

        let hasDefaultLoans = false;

        membersData.forEach(m => {
            const approved = m.approved_loan || 0;
            const paid = m.paid_loan || 0;
            const remaining = approved - paid;
            
            let statusBadge = `<span class="badge badge-pending">በማጣራት ላይ</span>`;
            if (m.status === 'approved') statusBadge = `<span class="badge badge-approved">የጸደቀ</span>`;
            if (m.status === 'rejected') statusBadge = `<span class="badge badge-danger">ውድቅ የተደረገ</span>`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${m.ref_no || '-'}</b></td>
                <td>${m.first_name} ${m.father_name}</td>
                <td>${m.phone_number}</td>
                <td style="color: var(--gold);">${approved.toLocaleString()} ብር</td>
                <td style="color: var(--success);">${paid.toLocaleString()} ብር</td>
                <td style="color: var(--danger);">${remaining.toLocaleString()} ብር</td>
                <td>${statusBadge}</td>
                <td>
                    ${m.status !== 'approved' ? `<button class="btn-action btn-approve" onclick="updateMemberStatus('${m.id}', 'approved')">አጽድቅ</button>` : ''}
                    ${m.status !== 'rejected' ? `<button class="btn-action btn-reject" onclick="updateMemberStatus('${m.id}', 'rejected')">Reject</button>` : ''}
                    <button class="btn-action btn-reject" style="background:#b91c1c" onclick="openDeleteModal('${m.id}')">ሰርዝ</button>
                </td>
            `;
            tbody.appendChild(tr);

            // የተበላሹ/ያልተከፈሉ ብድሮች ካሉ
            if (remaining > 0 && m.is_defaulted) {
                hasDefaultLoans = true;
                const dTr = document.createElement('tr');
                dTr.innerHTML = `
                    <td><b>${m.ref_no}</b></td>
                    <td>${m.first_name} ${m.father_name}</td>
                    <td style="color: var(--danger); font-weight: bold;">${remaining.toLocaleString()} ብር</td>
                    <td><span class="badge badge-danger">የዘገየ/የተበላሸ</span></td>
                    <td>
                        <button class="btn-action btn-msg" onclick="quickWarning('${m.id}')">ማስጠንቀቂያ ላክ</button>
                    </td>
                `;
                defaultTbody.appendChild(dTr);
            }
        });

        if(!hasDefaultLoans) {
            defaultTbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--success);">ምንም አይነት የተበላሸ ወይም የዘገየ ብድር የለም።</td></tr>`;
        }
    }

    // Dropdown ምርጫዎችን መሙላት
    function populateSelects() {
        const loanSelect = document.getElementById('loanMemberSelect');
        const msgSelect = document.getElementById('msgMemberSelect');
        loanSelect.innerHTML = '<option value="">አባል ይምረጡ...</option>';
        msgSelect.innerHTML = '<option value="">አባል ይምረጡ...</option>';

        membersData.forEach(m => {
            const opt = `<option value="${m.id}">${m.first_name} ${m.father_name} (${m.ref_no})</option>`;
            loanSelect.innerHTML += opt;
            msgSelect.innerHTML += opt;
        });
    }

    // 3. የብድርና ዕዳ መረጃዎችን ማዘመን (Update Loan Balance)
    document.getElementById('updateLoanForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const member_id = document.getElementById('loanMemberSelect').value;
        const approved_loan = document.getElementById('approvedLoanInput').value;
        const paid_loan = document.getElementById('paidLoanInput').value;

        try {
            const res = await fetch('/api/admin/update_loan', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ member_id, approved_loan, paid_loan })
            });
            const resData = await res.json();
            alert(resData.message || "የብድር መረጃው ተዘምኗል!");
            loadAdminMembers();
        } catch(err) {
            alert("ማዘመን አልተቻለም!");
        }
    });

    // 4. አባል ማጽደቅ / ውድቅ ማድረግ (Approve / Reject)
    async function updateMemberStatus(member_id, status) {
        try {
            const res = await fetch('/api/admin/update_status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ member_id, status })
            });
            const data = await res.json();
            alert(data.message);
            loadAdminMembers();
        } catch(e) { alert("ሁኔታውን መቀየር አልተቻለም!"); }
    }

    // 5. አባል መሰረዝ (Delete Member)
    function openDeleteModal(id) {
        document.getElementById('deleteTargetId').value = id;
        document.getElementById('deleteModal').classList.remove('hidden');
    }
    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.add('hidden');
    }
    async function confirmDeleteMember() {
        const id = document.getElementById('deleteTargetId').value;
        try {
            const res = await fetch(`/api/admin/delete_member/${id}`, { method: 'DELETE' });
            const data = await res.json();
            alert(data.message || "አባሉ ተሰርዟል!");
            closeDeleteModal();
            loadAdminMembers();
        } catch(e) { alert("መሰረዝ አልተቻለም!"); }
    }

    // 6. ለአባሉ ቀጥታ ማሳወቂያ መላክ
    document.getElementById('sendMessageForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            member_id: document.getElementById('msgMemberSelect').value,
            title: document.getElementById('msgTitle').value,
            body: document.getElementById('msgBody').value
        };
        try {
            const res = await fetch('/api/admin/send_notification', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            alert(data.message || "መልእክቱ ተልኳል!");
            document.getElementById('sendMessageForm').reset();
        } catch(e) { alert("መልእክት መላክ አልተቻለም!"); }
    });

    function quickWarning(memberId) {
        document.getElementById('msgMemberSelect').value = memberId;
        document.getElementById('msgTitle').value = "የአስቸኳይ ብድር ክፍያ ማሳሰቢያ";
        document.getElementById('msgBody').value = "ውድ አባል፣ ያለብዎትን የብድር ክፍያ ማጠናቀቂያ ጊዜ ያለፈ በመሆኑ እባክዎን በአስቸኳይ ክፍያውን ይፈጽሙ።";
        window.scrollTo({ top: document.getElementById('sendMessageForm').offsetTop, behavior: 'smooth' });
    }
</script>
</body>
</html>
