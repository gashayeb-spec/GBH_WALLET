<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አድሚን ፓናል - ተራመድ ሳኮ</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --gold: #f59e0b;
            --text: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.1);
            --success: #10b981; --danger: #ef4444; --blue: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header h2 { color: var(--gold); font-size: 1.3rem; }
        
        .top-controls { display: flex; gap: 10px; width: 100%; max-width: 500px; }
        .search-box { flex: 1; padding: 8px 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: white; }
        .btn-refresh { background: #334155; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
        
        .table-responsive { overflow-x: auto; background: var(--card); border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 1000px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #1e293b; color: var(--gold); white-space: nowrap; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }

        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
        .badge-pending { background: rgba(245, 158, 11, 0.2); color: var(--gold); }
        .badge-approved { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-rejected { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .doc-link { color: var(--blue); text-decoration: none; margin-right: 5px; font-size: 0.8rem; }
        .doc-link:hover { text-decoration: underline; }

        .btn-action { padding: 5px 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 3px; font-size: 0.75rem; }
        .btn-edit { background: var(--blue); color: white; }
        .btn-approve { background: var(--success); color: white; }
        .btn-reject { background: var(--danger); color: white; }
        
        /* Modal Popup */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: var(--card); padding: 22px; border-radius: 12px; width: 95%; max-width: 450px; border: 1px solid var(--gold); }
        .modal-content h3 { color: var(--gold); margin-bottom: 15px; font-size: 1.1rem; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: white; }
        .modal-btns { display: flex; justify-content: space-between; margin-top: 18px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i class="fas fa-users-cog"></i> ተራመድ ሳኮ - አድሚን ማኔጅመንት</h2>
        <div class="top-controls">
            <input type="text" id="searchInput" class="search-box" placeholder="በስም ወይም በስልክ ፈልግ..." onkeyup="filterMembers()">
            <button class="btn-refresh" onclick="loadMembers()"><i class="fas fa-sync"></i> አድስ</button>
        </div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>የተመዘገበበት ቀን</th>
                    <th>የቁጠባ No</th>
                    <th>የብድር ሴሪ</th>
                    <th>ሙሉ ስም</th>
                    <th>ስልክ</th>
                    <th>ሀገር / TIN</th>
                    <th>የተላኩ ሰነዶች</th>
                    <th>ቁጠባ (ETB)</th>
                    <th>የተፈቀደ ብድር</th>
                    <th>የተከፈለ ብድር</th>
                    <th>ሁኔታ</th>
                    <th>እርምጃዎች</th>
                </tr>
            </thead>
            <tbody id="membersTableBody">
                <tr><td colspan="12" style="text-align: center;">መረጃዎች በመጫን ላይ...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal for Financial & Series Edit -->
<div id="editModal" class="modal hidden">
    <div class="modal-content">
        <h3><i class="fas fa-edit"></i> የደብተር እና ሂሳብ ማስተካከያ</h3>
        <input type="hidden" id="editMemberId">
        
        <div class="input-group">
            <label>የብድር ሴሪ ቁጥር (Loan Series No)</label>
            <input type="text" id="editLoanSeriesNo" placeholder="ምሳሌ: LN-001-A">
        </div>
        <div class="input-group">
            <label>የቁጠባ መጠን (ETB)</label>
            <input type="number" step="any" id="editPaidAmount">
        </div>
        <div class="input-group">
            <label>የተፈቀደ ብድር መጠን (ETB)</label>
            <input type="number" step="any" id="editApprovedLoan">
        </div>
        <div class="input-group">
            <label>የተከፈለ ብድር ተመላሽ (ETB)</label>
            <input type="number" step="any" id="editPaidLoan">
        </div>

        <div class="modal-btns">
            <button class="btn-action btn-approve" style="padding: 8px 15px;" onclick="saveFinancials()"><i class="fas fa-save"></i> አስቀምጥ</button>
            <button class="btn-action btn-reject" style="padding: 8px 15px;" onclick="closeModal()">ዝጋ</button>
        </div>
    </div>
</div>

<script>
    let allMembersData = [];

    window.addEventListener('DOMContentLoaded', loadMembers);

    async function loadMembers() {
        try {
            const res = await fetch('/api/admin/members');
            const data = await res.json();
            
            if (data.status === "success" && data.members) {
                allMembersData = data.members;
                renderTable(allMembersData);
            }
        } catch (e) {
            console.error(e);
            document.getElementById('membersTableBody').innerHTML = '<tr><td colspan="12" style="text-align: center; color: var(--danger);">መረጃውን መጫን አልተቻለም!</td></tr>';
        }
    }

    function renderTable(members) {
        const tbody = document.getElementById('membersTableBody');
        tbody.innerHTML = '';

        if (members.length === 0) {
            tbody.innerHTML = '<tr><td colspan="12" style="text-align: center;">ምንም ተመዝጋቢ አልተገኘም!</td></tr>';
            return;
        }

        members.forEach(m => {
            const tr = document.createElement('tr');
            
            // የደብተር ሰነዶች ሊንክ
            let docsHtml = '';
            if (m.national_id_path) docsHtml += `<a class="doc-link" href="/${m.national_id_path}" target="_blank"><i class="fas fa-id-card"></i> መታወቂያ</a><br>`;
            if (m.photo_path) docsHtml += `<a class="doc-link" href="/${m.photo_path}" target="_blank"><i class="fas fa-image"></i> ፎቶ</a><br>`;
            if (m.trade_license_path) docsHtml += `<a class="doc-link" href="/${m.trade_license_path}" target="_blank"><i class="fas fa-file-contract"></i> ንግድ ፈቃድ</a>`;
            if (!docsHtml) docsHtml = '-';

            // Status Badge
            let badgeClass = 'badge-pending';
            if (m.status === 'approved') badgeClass = 'badge-approved';
            if (m.status === 'rejected') badgeClass = 'badge-rejected';

            // የቀን ፎርማት
            const createdDate = m.created_at ? m.created_at.split('.')[0] : '-';

            tr.innerHTML = `
                <td style="font-size: 0.75rem; color: var(--text-muted);">${createdDate}</td>
                <td><b>${m.ref_no}</b></td>
                <td style="color: var(--gold); font-weight: bold;">${m.loan_series_no || '-'}</td>
                <td><b>${m.first_name} ${m.father_name} ${m.grand_name || ''}</b></td>
                <td>${m.phone_number}</td>
                <td style="font-size: 0.75rem;">${m.country || 'ኢትዮጵያ'}<br>TIN: ${m.tin_number || '-'}</td>
                <td>${docsHtml}</td>
                <td style="color: var(--success); font-weight: bold;">${(m.paid_amount || 0).toLocaleString()} ብር</td>
                <td style="color: var(--gold); font-weight: bold;">${(m.approved_loan || 0).toLocaleString()} ብር</td>
                <td style="color: #60a5fa; font-weight: bold;">${(m.paid_loan || 0).toLocaleString()} ብር</td>
                <td><span class="badge ${badgeClass}">${m.status}</span></td>
                <td>
                    <button class="btn-action btn-edit" onclick="openModal(${m.id}, '${m.loan_series_no || ''}', ${m.paid_amount || 0}, ${m.approved_loan || 0}, ${m.paid_loan || 0})"><i class="fas fa-edit"></i></button>
                    <button class="btn-action btn-approve" onclick="updateStatus(${m.id}, 'approved')"><i class="fas fa-check"></i></button>
                    <button class="btn-action btn-reject" onclick="updateStatus(${m.id}, 'rejected')"><i class="fas fa-times"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterMembers() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allMembersData.filter(m => 
            (m.first_name && m.first_name.toLowerCase().includes(query)) ||
            (m.father_name && m.father_name.toLowerCase().includes(query)) ||
            (m.phone_number && m.phone_number.includes(query)) ||
            (m.ref_no && m.ref_no.toLowerCase().includes(query))
        );
        renderTable(filtered);
    }

    function openModal(id, seriesNo, paid, approved, paidLoan) {
        document.getElementById('editMemberId').value = id;
        document.getElementById('editLoanSeriesNo').value = seriesNo;
        document.getElementById('editPaidAmount').value = paid;
        document.getElementById('editApprovedLoan').value = approved;
        document.getElementById('editPaidLoan').value = paidLoan;
        document.getElementById('editModal').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('editModal').classList.add('hidden');
    }

    async function saveFinancials() {
        const id = document.getElementById('editMemberId').value;
        const seriesNo = document.getElementById('editLoanSeriesNo').value;
        const paid_amount = document.getElementById('editPaidAmount').value;
        const approved_loan = document.getElementById('editApprovedLoan').value;
        const paid_loan = document.getElementById('editPaidLoan').value;

        try {
            const res = await fetch('/api/admin/update_financials', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    member_id: id,
                    loan_series_no: seriesNo,
                    paid_amount: paid_amount,
                    approved_loan: approved_loan,
                    paid_loan: paid_loan
                })
            });
            const data = await res.json();
            alert(data.message || "መረጃው በስኬት ተዘምኗል!");
            closeModal();
            loadMembers();
        } catch (e) {
            alert("ስህተት ተከሰቷል!");
        }
    }

    async function updateStatus(id, status) {
        try {
            const res = await fetch('/api/admin/update_status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ member_id: id, status: status })
            });
            const data = await res.json();
            alert(data.message || "ሁኔታው ተቀይሯል!");
            loadMembers();
        } catch (e) {
            alert("ስህተት ተከሰቷል!");
        }
    }
</script>
</body>
</html>
