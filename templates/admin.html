<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ተራመድ ሳኮ - አድሚን ፓናል</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --gold: #f59e0b;
            --text: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.1);
            --success: #10b981; --danger: #ef4444; --primary: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .header h1 { color: var(--gold); font-size: 1.5rem; }
        
        .table-responsive { overflow-x: auto; background: var(--card); border-radius: 10px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border); }
        th { background: rgba(0,0,0,0.3); color: var(--gold); }
        
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .badge-pending { background: rgba(245, 158, 11, 0.2); color: var(--gold); border: 1px solid var(--gold); }
        .badge-approved { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .badge-rejected { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        
        .btn-action { padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; margin-right: 4px; }
        .btn-approve { background: var(--success); color: #fff; }
        .btn-reject { background: var(--danger); color: #fff; }
        .btn-edit { background: var(--primary); color: #fff; }
        
        /* Modal Style */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 10px; width: 350px; border: 1px solid var(--gold); }
        .modal-content h3 { color: var(--gold); margin-bottom: 15px; }
        .modal-content label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-top: 10px; }
        .modal-content input { width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
        .modal-btns { display: flex; justify-content: space-between; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-user-shield"></i> ተራመድ ሳኮ - አድሚን ማኔጅመንት</h1>
        <button onclick="loadMembers()" class="btn-action btn-edit"><i class="fas fa-sync"></i> አድስ (Refresh)</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Ref No</th>
                    <th>ሙሉ ስም</th>
                    <th>ስልክ / ሀገር</th>
                    <th>TIN</th>
                    <th>ሰነዶች</th>
                    <th>ቁጠባ</th>
                    <th>የተፈቀደ ብድር</th>
                    <th>ሁኔታ</th>
                    <th>እርምጃ (Actions)</th>
                </tr>
            </thead>
            <tbody id="memberAdminTable">
                <!-- Data will load here dynamically -->
            </tbody>
        </table>
    </div>
</div>

<!-- Financial Edit Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-edit"></i> ሂሳብ ማስተካከያ</h3>
        <input type="hidden" id="editMemberId">
        
        <label>የተቆጠበ ቁጠባ መጠን (ETB)</label>
        <input type="number" id="editSavings">
        
        <label>የተፈቀደ ብድር (ETB)</label>
        <input type="number" id="editApprovedLoan">
        
        <label>የተከፈለ ብድር (ETB)</label>
        <input type="number" id="editPaidLoan">
        
        <div class="modal-btns">
            <button onclick="saveFinancials()" class="btn-action btn-approve">አስቀምጥ</button>
            <button onclick="closeModal()" class="btn-action btn-reject">ዝጋ</button>
        </div>
    </div>
</div>

<script>
    let membersData = [];

    window.addEventListener('DOMContentLoaded', loadMembers);

    async function loadMembers() {
        try {
            const res = await fetch('/api/admin/members');
            const data = await res.json();
            if (data.status === 'success') {
                membersData = data.members;
                renderTables();
            }
        } catch (e) {
            console.error("Failed to load members", e);
        }
    }

    function renderTables() {
        const tbody = document.getElementById('memberAdminTable');
        tbody.innerHTML = '';

        membersData.forEach(m => {
            const approved = m.approved_loan || 0;
            const paidLoan = m.paid_loan || 0;
            const savings = m.paid_amount || 0;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${m.ref_no || '-'}</b></td>
                <td>${m.first_name} ${m.father_name} ${m.grand_name}</td>
                <td>${m.phone_number}<br><small style="color:var(--text-muted);">${m.country || 'ኢትዮጵያ'}</small></td>
                <td>${m.tin_number || '-'}</td>
                <td>
                    ${m.national_id_path ? `<a href="/${m.national_id_path}" target="_blank" style="color:var(--gold); font-size:0.8rem;">[መታወቂያ]</a> ` : ''}
                    ${m.photo_path ? `<a href="/${m.photo_path}" target="_blank" style="color:var(--success); font-size:0.8rem;">[ፎቶ]</a> ` : ''}
                    ${m.trade_license_path ? `<a href="/${m.trade_license_path}" target="_blank" style="color:var(--primary); font-size:0.8rem;">[ንግድ ፈቃድ]</a>` : ''}
                </td>
                <td style="color: var(--success); font-weight:bold;">${savings.toLocaleString()} ብር</td>
                <td style="color: var(--gold); font-weight:bold;">${approved.toLocaleString()} ብር</td>
                <td>
                    ${m.status === 'pending' ? `<span class="badge badge-pending">Pending</span>` : ''}
                    ${m.status === 'approved' ? `<span class="badge badge-approved">Approved</span>` : ''}
                    ${m.status === 'rejected' ? `<span class="badge badge-rejected">Rejected</span>` : ''}
                </td>
                <td>
                    ${m.status !== 'approved' ? `<button class="btn-action btn-approve" onclick="updateMemberStatus('${m.id}', 'approved')">አጽድቅ</button>` : ''}
                    <button class="btn-action btn-edit" onclick="openEditModal(${m.id})">አስተካክል</button>
                    ${m.status !== 'rejected' ? `<button class="btn-action btn-reject" onclick="updateMemberStatus('${m.id}', 'rejected')">Reject</button>` : ''}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function updateMemberStatus(id, status) {
        if (!confirm(`እርግጠኛ ነዎት የአባሉን ሁኔታ ወደ ${status} መቀየር ይፈልጋሉ?`)) return;

        try {
            const res = await fetch('/api/admin/update_status', {
                method: 'POST',
                headers: { 'Content-Type': 'json' },
                body: JSON.stringify({ member_id: id, status: status })
            });
            const data = await res.json();
            alert(data.message);
            loadMembers();
        } catch (e) {
            alert("ሁኔታውን መቀየር አልተቻለም!");
        }
    }

    function openEditModal(id) {
        const m = membersData.find(item => item.id === id);
        if (!m) return;

        document.getElementById('editMemberId').value = m.id;
        document.getElementById('editSavings').value = m.paid_amount || 0;
        document.getElementById('editApprovedLoan').value = m.approved_loan || 0;
        document.getElementById('editPaidLoan').value = m.paid_loan || 0;

        document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    async function saveFinancials() {
        const id = document.getElementById('editMemberId').value;
        const savings = document.getElementById('editSavings').value;
        const approved = document.getElementById('editApprovedLoan').value;
        const paid = document.getElementById('editPaidLoan').value;

        try {
            const res = await fetch('/api/admin/update_financials', {
                method: 'POST',
                headers: { 'Content-Type': 'json' },
                body: JSON.stringify({
                    member_id: id,
                    paid_amount: savings,
                    approved_loan: approved,
                    paid_loan: paid
                })
            });
            const data = await res.json();
            alert(data.message);
            closeModal();
            loadMembers();
        } catch (e) {
            alert("ማስተካከል አልተቻለም!");
        }
    }
</script>
</body>
</html>
